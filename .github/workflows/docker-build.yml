name: Build and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: application
            dockerfile: compose/Dockerfile.app
          - image: migrations
            dockerfile: compose/Dockerfile.migrations
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/nhsdkk/websearch-${{ matrix.image }}:latest
            ghcr.io/nhsdkk/websearch-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: websearch-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out manifests
        uses: actions/checkout@v6
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
      - name: Connect to the cluster
        uses: azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          kubeconfig-encoding: base64
      - name: Add secret manifest
        env:
          SECRETS_MANIFEST: ${{ secrets.SECRETS_MANIFEST }}
        run: |
          set -euo pipefail
          if [[ -z "$SECRETS_MANIFEST" ]]; then
            echo "Configure the SECRETS_MANIFEST Actions secret with the Kubernetes Secret YAML." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SECRETS_MANIFEST" > k8s/secret.yaml
      - name: Apply namespace
        uses: azure/k8s-deploy@v7
        with:
          manifests: k8s/namespace.yaml
          annotate-resources: false
      - name: Apply config and secrets
        uses: azure/k8s-deploy@v7
        with:
          namespace: websearch
          manifests: |
            k8s/configmap.yaml
            k8s/secret.yaml
          annotate-resources: false
      - name: Remove previous migration Job
        run: kubectl delete job websearch-migrations --namespace websearch --ignore-not-found --wait=true
      - name: Start database migrations
        uses: azure/k8s-deploy@v7
        with:
          namespace: websearch
          manifests: k8s/migration-job.yaml
          images: ghcr.io/nhsdkk/websearch-migrations:${{ github.sha }}
          pull-images: false
          annotate-resources: false
          timeout: 10m
      - name: Wait for database migrations
        run: kubectl wait job/websearch-migrations --namespace websearch --for=condition=complete --timeout=10m
      - name: Remove legacy application Deployment
        run: kubectl delete deployment websearch --namespace websearch --ignore-not-found --wait=true
      - name: Roll out application
        uses: azure/k8s-deploy@v7
        with:
          namespace: websearch
          manifests: |
            k8s/service.yaml
            k8s/daemonset.yaml
          images: ghcr.io/nhsdkk/websearch-application:${{ github.sha }}
          pull-images: false
          annotate-resources: false
          timeout: 30m
