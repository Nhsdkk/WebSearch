name: webrobot-infra

services:
  postgres:
    hostname: postgres
    image: postgres:18-alpine
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5G
    env_file: "./.env"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: robot_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 1s
      retries: 5
    ports:
      - "7432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - common
  
  mongodb:
    image: mongodb/mongodb-atlas-local
    hostname: mongodb
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 60G
    env_file: "./.env"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb/db:/data/db
      - ./data/mongodb/configdb:/data/configdb
      - ./data/mongodb/mongot:/data/mongot
    networks:
      - common

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      - mongodb
    env_file: "./.env"
    environment:
      # MongoDB connection settings
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@mongodb:27017/
      # Basic auth protects the web UI from unauthorized access
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_DB_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_DB_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - common

networks:
  common:
    driver: bridge
    name: webrobot_common
