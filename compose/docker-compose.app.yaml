name: webrobot-app

include:
  - ./docker-compose.infra.yaml

services:
  migrations:
    hostname: migrations
    pull_policy: always
    image: ghcr.io/nhsdkk/websearch-migrations:latest
    build:
      context: ../
      dockerfile: compose/Dockerfile.migrations
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    env_file: ".env"
    environment:
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/robot_db
    depends_on:
        postgres:
          condition: service_healthy
    networks:
      - common

  application:
    hostname: application
    pull_policy: always
    image: ghcr.io/nhsdkk/websearch-application:latest
    build:
      context: ../
      dockerfile: compose/Dockerfile.app
    env_file: "./.env"
    deploy:
  
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    environment:
      APPLICATION_HOST: 0.0.0.0
      APPLICATION_PORT: 8080
      HTTP_CLIENT_USER_AGENT: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:156.0) Gecko/20100101 Firefox/156.0"
      HTTP_CLIENT_CONNECT_TIMEOUT_SECONDS: 5
      HTTP_CLIENT_READ_TIMEOUT_SECONDS: 30
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: robot_db
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: 27017
      MONGO_DB_JSON_DATA_DATABASE_NAME: processed_content_db
      MONGO_DB_RAW_DATA_DATABASE_NAME: raw_html_content_db
      GLOBAL_SITEMAP_PROCESSING_JOB_FAIL_TIMEOUT_SECONDS: 5
      GLOBAL_SITEMAP_PROCESSING_JOB_SUCCESS_TIMEOUT_SECONDS: 0.5
      GLOBAL_SITEMAP_PROCESSING_JOB_BATCH_SIZE: 20
      LOCAL_SITEMAP_PROCESSING_JOB_FAIL_TIMEOUT_SECONDS: 5
      LOCAL_SITEMAP_PROCESSING_JOB_SUCCESS_TIMEOUT_SECONDS: 0.5
      LOCAL_SITEMAP_PROCESSING_JOB_BATCH_SIZE: 20
      OUTDATED_SOURCE_PROCESSING_SCHEDULER_FAIL_TIMEOUT_SECONDS: 5
      OUTDATED_SOURCE_PROCESSING_SCHEDULER_SUCCESS_TIMEOUT_SECONDS: 0.5
      OUTDATED_SOURCE_PROCESSING_SCHEDULER_BATCH_SIZE: 20
      OUTDATED_PAGE_PROCESSING_SCHEDULER_FAIL_TIMEOUT_SECONDS: 5
      OUTDATED_PAGE_PROCESSING_SCHEDULER_SUCCESS_TIMEOUT_SECONDS: 0.5
      OUTDATED_PAGE_PROCESSING_SCHEDULER_BATCH_SIZE: 20
      RIA_PAGE_PROCESSING_JOB_FAIL_TIMEOUT_SECONDS: 5
      RIA_PAGE_PROCESSING_JOB_SUCCESS_TIMEOUT_SECONDS: 0.5
      RIA_PAGE_PROCESSING_JOB_BATCH_SIZE: 5
      IZVESTIA_PAGE_PROCESSING_JOB_FAIL_TIMEOUT_SECONDS: 5
      IZVESTIA_PAGE_PROCESSING_JOB_SUCCESS_TIMEOUT_SECONDS: 0.5
      IZVESTIA_PAGE_PROCESSING_JOB_BATCH_SIZE: 5
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    stop_grace_period: 1m
    networks:
      - common
